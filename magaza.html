<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mağaza</title>
<style>
  :root { --ink:#17212B; --steel:#5B6B79; --bg:#EEF1F3; --paper:#fff; --line:#D5DBE0; --acc:#E85D04; --acc2:#C24A00; --ok:#1F7A4D; --bad:#B3261E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif; }
  button, input, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  header { background:var(--ink); color:#fff; position:sticky; top:0; z-index:5; }
  .bar { max-width:1160px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; }
  .brand { font-size:20px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
  .bar input[type=search] { flex:1; min-width:0; padding:9px 12px; border:0; border-radius:6px; background:#fff; }
  .cartbtn { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:9px 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .cartbtn:hover { background:var(--acc2); }
  main { max-width:1160px; margin:0 auto; padding:18px 16px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; overflow:hidden; }
  .card .img { aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; font-size:40px; border-bottom:1px solid var(--line); }
  .card img { width:100%; height:100%; object-fit:contain; }
  .card .body { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card .name { font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .price { font-size:19px; font-weight:800; }
  .stock { font-size:12px; color:var(--steel); }
  .stock.low { color:var(--acc2); font-weight:600; }
  .btn { background:var(--ink); color:#fff; border:0; border-radius:6px; padding:9px 12px; font-weight:700; cursor:pointer; margin-top:auto; }
  .btn:hover { background:#2b3b4a; }
  .btn.acc { background:var(--acc); } .btn.acc:hover { background:var(--acc2); }
  .btn:disabled { background:#b9c1c8; cursor:default; }
  .step { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; }
  .step button { width:32px; height:32px; border:0; background:#fff; cursor:pointer; font-weight:700; }
  .step button:hover { background:var(--bg); }
  .step span { min-width:30px; text-align:center; font-weight:700; }
  .empty { text-align:center; color:var(--steel); padding:60px 0; }
  .shade { position:fixed; inset:0; background:rgba(10,16,22,.55); z-index:20; display:none; }
  .shade.open { display:block; }
  aside { position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--paper); z-index:21; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; }
  aside.open { transform:none; }
  @media (prefers-reduced-motion:reduce) { aside { transition:none; } }
  aside header { position:static; background:var(--paper); color:var(--ink); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:14px 16px; font-weight:800; font-size:17px; }
  aside header button { border:0; background:none; font-size:24px; cursor:pointer; line-height:1; }
  .drawer { flex:1; overflow:auto; padding:14px 16px; }
  .foot { border-top:1px solid var(--line); padding:14px 16px; }
  .line { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .line .t { flex:1; min-width:0; } .line .t b { display:block; font-weight:600; line-height:1.3; }
  .row { display:flex; justify-content:space-between; margin:3px 0; }
  .row.total { font-size:18px; font-weight:800; margin-top:8px; }
  label.f { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  .in { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .pay { display:flex; gap:8px; margin-top:6px; }
  .pay label { flex:1; border:1px solid var(--line); border-radius:6px; padding:9px 10px; cursor:pointer; font-size:14px; }
  .pay input { margin-right:6px; }
  .pay label:has(input:checked) { border-color:var(--acc); background:#FFF3EA; }
  .err { color:var(--bad); font-size:13px; margin:8px 0 0; min-height:18px; }
  .iban { background:var(--bg); border-radius:6px; padding:10px 12px; margin:10px 0; word-break:break-all; font-family:Consolas,monospace; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="brand">Mağaza</div>
  <input type="search" id="q" placeholder="Ürün ara" aria-label="Ürün ara">
  <button class="cartbtn" id="cartBtn">Sepet (<span id="cnt">0</span>)</button>
</div></header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Aramana uyan ürün bulunamadı.</div>
</main>
<div class="shade" id="shade"></div>
<aside id="drawer" aria-label="Sepet">
  <header><span id="dtitle">Sepetim</span><button id="dclose" aria-label="Kapat">×</button></header>
  <div class="drawer" id="dbody"></div>
  <div class="foot" id="dfoot"></div>
</aside>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c instanceof Node ? c : String(c)); });
  return e;
};
const money = (n) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';

let cfg = {}, products = [], cart = {}, payment = 'havale';
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch (e) {}
const byCode = (c) => products.find((p) => p.code === c);
const saveCart = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };

function setQty(code, q) {
  const p = byCode(code);
  q = Math.max(0, Math.min(q, p ? Math.min(p.stock, 20) : 0));
  if (q) cart[code] = q; else delete cart[code];
  saveCart(); renderGrid(); updateCount();
  if ($('#drawer').classList.contains('open') && $('#dtitle').textContent === 'Sepetim') renderCart();
}
function updateCount() { $('#cnt').textContent = Object.values(cart).reduce((a, b) => a + b, 0); }

function stepper(code) {
  return h('span', { class: 'step' },
    h('button', { 'aria-label': 'Azalt', onclick: () => setQty(code, (cart[code] || 0) - 1) }, '−'),
    h('span', {}, cart[code] || 0),
    h('button', { 'aria-label': 'Artır', onclick: () => setQty(code, (cart[code] || 0) + 1) }, '+'));
}

function renderGrid() {
  const q = $('#q').value.trim().toLocaleLowerCase('tr');
  const terms = q.split(/\s+/).filter(Boolean);
  const list = products.filter((p) => terms.every((t) => (p.name + ' ' + p.category).toLocaleLowerCase('tr').includes(t)));
  const grid = $('#grid');
  grid.replaceChildren(...list.map((p) => {
    const out = p.stock <= 0;
    return h('div', { class: 'card' },
      h('div', { class: 'img' }, p.image ? h('img', { src: p.image, alt: '', loading: 'lazy' }) : '📦'),
      h('div', { class: 'body' },
        h('div', { class: 'name' }, p.name),
        h('div', { class: 'price' }, money(p.price)),
        h('div', { class: 'stock' + (p.stock > 0 && p.stock <= 5 ? ' low' : '') }, out ? 'Tükendi' : p.stock <= 5 ? 'Son ' + p.stock + ' adet' : 'Stokta'),
        cart[p.code] ? stepper(p.code) : h('button', { class: 'btn', disabled: out, onclick: () => setQty(p.code, 1) }, out ? 'Tükendi' : 'Sepete ekle')));
  }));
  $('#empty').hidden = list.length > 0;
  if (!products.length) $('#empty').textContent = 'Şu an satışta ürün yok.';
}

function totals() {
  const sub = Object.entries(cart).reduce((s, [c, q]) => s + (byCode(c) ? byCode(c).price * q : 0), 0);
  const ship = cfg.freeOver > 0 && sub >= cfg.freeOver ? 0 : (cfg.shippingFee || 0);
  const cod = payment === 'kapida' ? (cfg.codFee || 0) : 0;
  return { sub, ship, cod, total: sub + ship + cod };
}
const sumRow = (l, v, cls) => h('div', { class: 'row ' + (cls || '') }, h('span', {}, l), h('span', {}, v));

function openDrawer() { $('#shade').classList.add('open'); $('#drawer').classList.add('open'); renderCart(); }
function closeDrawer() { $('#shade').classList.remove('open'); $('#drawer').classList.remove('open'); }

function renderCart() {
  $('#dtitle').textContent = 'Sepetim';
  const codes = Object.keys(cart).filter(byCode);
  const body = $('#dbody'), foot = $('#dfoot');
  if (!codes.length) {
    body.replaceChildren(h('div', { class: 'empty' }, 'Sepetin boş. Ürün ekleyerek başla.'));
    foot.replaceChildren(); return;
  }
  body.replaceChildren(...codes.map((c) => { const p = byCode(c);
    return h('div', { class: 'line' }, h('div', { class: 't' }, h('b', {}, p.name), h('span', { class: 'stock' }, money(p.price))), stepper(c)); }));
  const t = totals();
  foot.replaceChildren(sumRow('Ara toplam', money(t.sub)), sumRow('Kargo', t.ship ? money(t.ship) : 'Ücretsiz'),
    cfg.freeOver > 0 && t.ship ? h('div', { class: 'stock' }, money(cfg.freeOver - t.sub) + ' daha ekle, kargo ücretsiz olsun.') : null,
    h('button', { class: 'btn acc', style: 'width:100%;margin-top:10px', onclick: renderCheckout }, 'Siparişi tamamla'));
}

function renderCheckout() {
  $('#dtitle').textContent = 'Teslimat ve ödeme';
  const f = (id, label, tag = 'input', extra = {}) => [h('label', { class: 'f', for: id }, label), h(tag, { id, class: 'in', ...extra })];
  $('#dbody').replaceChildren(
    ...f('c_name', 'Ad soyad', 'input', { autocomplete: 'name' }),
    ...f('c_phone', 'Telefon', 'input', { type: 'tel', autocomplete: 'tel' }),
    ...f('c_city', 'Şehir', 'input', { autocomplete: 'address-level1' }),
    ...f('c_addr', 'Açık adres', 'textarea', { rows: 3, autocomplete: 'street-address' }),
    ...f('c_note', 'Sipariş notu (isteğe bağlı)', 'input'),
    h('label', { class: 'f' }, 'Ödeme yöntemi'),
    h('div', { class: 'pay' },
      h('label', {}, h('input', { type: 'radio', name: 'pay', value: 'havale', checked: payment === 'havale', onchange: () => { payment = 'havale'; sumFoot(); } }), 'Havale / EFT'),
      h('label', {}, h('input', { type: 'radio', name: 'pay', value: 'kapida', checked: payment === 'kapida', onchange: () => { payment = 'kapida'; sumFoot(); } }), 'Kapıda ödeme')));
  sumFoot();
}
function sumFoot() {
  const t = totals();
  $('#dfoot').replaceChildren(sumRow('Ara toplam', money(t.sub)), sumRow('Kargo', t.ship ? money(t.ship) : 'Ücretsiz'),
    t.cod ? sumRow('Kapıda ödeme bedeli', money(t.cod)) : null, sumRow('Toplam', money(t.total), 'total'),
    h('div', { class: 'err', id: 'err', role: 'alert' }),
    h('button', { class: 'btn acc', id: 'send', style: 'width:100%', onclick: submitOrder }, 'Siparişi onayla'),
    h('button', { class: 'btn', style: 'width:100%;margin-top:8px;background:#fff;color:var(--ink);border:1px solid var(--line)', onclick: renderCart }, 'Sepete dön'));
}

async function submitOrder() {
  const err = $('#err'), btn = $('#send');
  err.textContent = ''; btn.disabled = true;
  const body = {
    items: Object.entries(cart).map(([code, quantity]) => ({ code, quantity })), payment,
    customer: { name: $('#c_name').value, phone: $('#c_phone').value, city: $('#c_city').value, address: $('#c_addr').value },
    note: $('#c_note').value,
  };
  try {
    const r = await fetch('/api/store/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { err.textContent = d.error || 'Sipariş verilemedi.'; btn.disabled = false; if (r.status === 409) await loadProducts(); return; }
    cart = {}; saveCart(); updateCount(); await loadProducts();
    renderDone(d);
  } catch (e) { err.textContent = 'Bağlantı hatası, tekrar dene.'; btn.disabled = false; }
}

function renderDone(d) {
  $('#dtitle').textContent = 'Siparişin alındı';
  const bank = d.payment === 'havale';
  $('#dbody').replaceChildren(
    h('p', {}, 'Sipariş numaran: ', h('b', {}, d.orderNumber)),
    h('p', {}, 'Toplam: ', h('b', {}, money(d.total))),
    bank
      ? h('div', {}, h('p', {}, cfg.iban ? 'Tutarı aşağıdaki hesaba gönder. Açıklamaya sipariş numaranı yaz; ödemen onaylanınca kargoya veririz.' : 'Ödeme bilgilerini sana ayrıca ileteceğiz.'),
          cfg.iban ? h('div', { class: 'iban' }, cfg.iban, cfg.ibanOwner ? h('div', {}, cfg.ibanOwner) : null) : null)
      : h('p', {}, 'Ürünü teslim alırken kuryeye ' + money(d.total) + ' ödeyeceksin.'));
  $('#dfoot').replaceChildren(h('button', { class: 'btn', style: 'width:100%', onclick: closeDrawer }, 'Alışverişe devam et'));
}

async function loadProducts() {
  const d = await (await fetch('/api/store/products')).json();
  products = d.products || [];
  Object.keys(cart).forEach((c) => { if (!byCode(c)) delete cart[c]; else cart[c] = Math.min(cart[c], byCode(c).stock); if (!cart[c]) delete cart[c]; });
  saveCart(); updateCount(); renderGrid();
}

(async function init() {
  cfg = await (await fetch('/api/store/config')).json();
  $('#brand').textContent = cfg.name || 'Mağaza';
  document.title = cfg.name || 'Mağaza';
  $('#q').value = new URLSearchParams(location.search).get('q') || '';
  $('#q').addEventListener('input', renderGrid);
  $('#cartBtn').addEventListener('click', openDrawer);
  $('#dclose').addEventListener('click', closeDrawer);
  $('#shade').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  await loadProducts();
})();
</script>
</body>
</html>
